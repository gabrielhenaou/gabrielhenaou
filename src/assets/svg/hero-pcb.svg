<svg
    class="pcb-svg"
    viewBox="0 0 1000 1000"
    xmlns="http://www.w3.org/2000/svg">

    <!-- ===================================================== -->
    <!-- Controller -->
    <!-- ===================================================== -->

    <g class="controller">

        <!-- Body -->

        <rect
            class="controller__body"
            x="400"
            y="400"
            width="200"
            height="200"
            rx="10"/>

        <!-- Pin 1 -->

        <circle
            class="controller__pin-marker"
            cx="425"
            cy="425"
            r="5"/>

        <!-- ================= TOP ================= -->

        <rect class="controller__pin" x="415" y="385" width="10" height="15"/>
        <rect class="controller__pin" x="440" y="385" width="10" height="15"/>
        <rect class="controller__pin" x="465" y="385" width="10" height="15"/>
        <rect class="controller__pin" x="490" y="385" width="10" height="15"/>
        <rect class="controller__pin" x="515" y="385" width="10" height="15"/>
        <rect class="controller__pin" x="540" y="385" width="10" height="15"/>
        <rect class="controller__pin" x="565" y="385" width="10" height="15"/>

        <!-- ================= RIGHT ================= -->

        <rect class="controller__pin" x="600" y="415" width="15" height="10"/>
        <rect class="controller__pin" x="600" y="440" width="15" height="10"/>
        <rect class="controller__pin" x="600" y="465" width="15" height="10"/>
        <rect class="controller__pin" x="600" y="490" width="15" height="10"/>
        <rect class="controller__pin" x="600" y="515" width="15" height="10"/>
        <rect class="controller__pin" x="600" y="540" width="15" height="10"/>
        <rect class="controller__pin" x="600" y="565" width="15" height="10"/>

        <!-- ================= BOTTOM ================= -->

        <rect class="controller__pin" x="415" y="600" width="10" height="15"/>
        <rect class="controller__pin" x="440" y="600" width="10" height="15"/>
        <rect class="controller__pin" x="465" y="600" width="10" height="15"/>
        <rect class="controller__pin" x="490" y="600" width="10" height="15"/>
        <rect class="controller__pin" x="515" y="600" width="10" height="15"/>
        <rect class="controller__pin" x="540" y="600" width="10" height="15"/>
        <rect class="controller__pin" x="565" y="600" width="10" height="15"/>

        <!-- ================= LEFT ================= -->

        <rect class="controller__pin" x="385" y="415" width="15" height="10"/>
        <rect class="controller__pin" x="385" y="440" width="15" height="10"/>
        <rect class="controller__pin" x="385" y="465" width="15" height="10"/>
        <rect class="controller__pin" x="385" y="490" width="15" height="10"/>
        <rect class="controller__pin" x="385" y="515" width="15" height="10"/>
        <rect class="controller__pin" x="385" y="540" width="15" height="10"/>
        <rect class="controller__pin" x="385" y="565" width="15" height="10"/>

    </g>

</svg>